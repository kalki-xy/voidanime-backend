name: edge-check
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Supabase edge relay + sync
        run: |
          B=https://lbgtjwuozqgstqzvowok.supabase.co/functions/v1/yrcine
          echo "=== health ==="
          curl -sS -m 30 -w "\nHTTP %{http_code}\n" "$B/api/health"
          echo "=== proxy (tmdb) ==="
          curl -sS -m 30 -o /dev/null -w "HTTP %{http_code}\n" "$B/api/proxy?url=https%3A%2F%2Fapi.themoviedb.org%2F3%2Ftrending%2Fall%2Fday%3Fapi_key%3D20be784f740b6b638c906dde5b35efae"
          echo "=== embed (vidfast) ==="
          curl -sS -m 30 -o /dev/null -w "HTTP %{http_code}\n" "$B/api/embed?url=https%3A%2F%2Fvidfast.pro%2Fmovie%2F533535"
          echo "=== sync POST ==="
          curl -sS -m 30 -X POST -H 'content-type: application/json' -d '{"uid":"ci-test","key":"yrcine","data":{"name":"CI","watchlist":[{"id":1}]}}' "$B/api/sync"
          echo
          echo "=== sync GET ==="
          curl -sS -m 30 "$B/api/sync?uid=ci-test&key=yrcine"
          echo
