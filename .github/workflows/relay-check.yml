name: relay-check
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Probe relay endpoints
        run: |
          echo "=== /api/health ==="
          curl -sS -m 30 -w "\nHTTP %{http_code}\n" https://voidanime-backend.vercel.app/api/health || echo "curl failed"
          echo "=== /api/proxy headers+body ==="
          curl -sS -i -m 30 "https://voidanime-backend.vercel.app/api/proxy?url=https%3A%2F%2Fexample.com" | head -c 900 || echo "curl failed"
          echo
          echo "=== /api/proxy with k=test ==="
          curl -sS -o /dev/null -w "HTTP %{http_code}\n" "https://voidanime-backend.vercel.app/api/proxy?url=https%3A%2F%2Fexample.com&k=test" || echo "curl failed"
          echo "=== /api/music/search ==="
          curl -sS -m 45 -o /dev/null -w "HTTP %{http_code}\n" "https://voidanime-backend.vercel.app/api/music/search?q=arijit&limit=3" || echo "curl failed"
