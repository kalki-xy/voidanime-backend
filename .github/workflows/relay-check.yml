name: relay-check
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Probe relay endpoints
        run: |
          echo "=== /api/catalog headers+body ==="
          curl -sS -i -m 30 "https://voidanime-backend.vercel.app/api/catalog?path=trending/all/day" | head -c 900 || echo "curl failed"
          echo
          echo "=== /api/catalog (cache-bust) ==="
          curl -sS -o /dev/null -w "HTTP %{http_code}\n" "https://voidanime-backend.vercel.app/api/catalog?path=trending/all/day&cb=$RANDOM" || echo "curl failed"
          echo "=== /api/embed (vidfast) ==="
          curl -sS -o /dev/null -w "HTTP %{http_code}\n" "https://voidanime-backend.vercel.app/api/embed?url=https%3A%2F%2Fvidfast.pro%2Fmovie%2F533535" || echo "curl failed"
