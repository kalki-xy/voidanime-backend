name: relay-check
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Probe relay endpoints
        run: |
          echo "=== /api/health ==="
          curl -sS -m 30 -w "\nHTTP %{http_code}\n" https://voidanime-backend.vercel.app/api/health || echo "curl failed"
          echo "=== /api/proxy (example.com) ==="
          curl -sS -m 30 -o /dev/null -w "HTTP %{http_code}\n" "https://voidanime-backend.vercel.app/api/proxy?url=https%3A%2F%2Fexample.com" || echo "curl failed"
          echo "=== /api/catalog ==="
          curl -sS -m 30 -o /dev/null -w "HTTP %{http_code}\n" "https://voidanime-backend.vercel.app/api/catalog?path=trending/all/day" || echo "curl failed"
          echo "=== /api/music/debug ==="
          curl -sS -m 45 "https://voidanime-backend.vercel.app/api/music/debug?q=arijit" | head -c 3000 || echo "curl failed"
          echo
          echo "=== /api/embed (vidfast) ==="
          curl -sS -m 30 -o /dev/null -w "HTTP %{http_code}\n" "https://voidanime-backend.vercel.app/api/embed?url=https%3A%2F%2Fvidfast.pro%2Fmovie%2F533535" || echo "curl failed"
